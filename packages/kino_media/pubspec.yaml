name: kino_media
description: >-
  The playback engine boundary. Defines PlaybackController and implements it
  over libmpv via media_kit. No media_kit type crosses this package's public
  surface — see docs/DECISIONS.md.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  kino_core: ^0.1.0
  # For FrameRate: an exact seek is a frame operation, and the rate is what
  # makes it one.
  kino_review: ^0.1.0

  # libmpv, and the texture bridge that gets decoded frames into Flutter's
  # compositor without a per-frame CPU copy. §0.2: the engine is not ours to
  # write. `media_kit_libs_linux` links the distribution's libmpv rather than
  # bundling one, which is what keeps the .deb's licensing simple.
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
